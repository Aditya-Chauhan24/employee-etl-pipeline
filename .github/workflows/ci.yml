name: ETL CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d employee_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: employee_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Initialize database schema
        run: |
          python -c "from pipeline import get_engine, setup_database; engine = get_engine(); connection = engine.connect(); setup_database(connection); connection.commit(); connection.close(); engine.dispose()"

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t employee-etl:ci .

      - name: Run ETL container
        run: |
          docker run --rm \
            --network host \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_NAME=employee_db \
            employee-etl:ci